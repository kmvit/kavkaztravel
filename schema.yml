components:
  schemas:
    AccommodationType:
      type: object
      description: |-
        Сериализатор для модели AccommodationType.
        Описывает типы размещения.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required:
      - id
      - name
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Amenity:
      type: object
      description: |-
        Сериализатор для модели Amenity.
        Описывает удобства, доступные в отеле.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required:
      - id
      - name
    Blog:
      type: object
      description: |-
        Сериализатор для модели Blog.

        Этот сериализатор используется для преобразования данных блогов
        в формат JSON и обратно. Он позволяет сериализовать и десериализовать
        все поля модели Blog.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date
          readOnly: true
          nullable: true
        content:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        seo_title:
          type: string
          nullable: true
          maxLength: 255
        seo_description:
          type: string
          nullable: true
        title:
          type: string
          title: Название
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        published:
          type: boolean
        owner:
          type: integer
      required:
      - created_at
      - date
      - id
      - name
      - title
      - updated_at
    BodyTypeEnum:
      enum:
      - sedan
      - suv
      - hatchback
      - crossover
      - minivan
      - wagon
      type: string
      description: |-
        * `sedan` - Sedan
        * `suv` - SUV
        * `hatchback` - Hatchback
        * `crossover` - Crossover
        * `minivan` - Minivan
        * `wagon` - Wagon

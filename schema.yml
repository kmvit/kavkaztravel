        id:
          type: integer
          readOnly: true
        content_type:
          type: string
          title: Python model class name
        user:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Статус брони
